<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>虹学野球チャレンジ</title>

<style>
:root{
  --navy:#0d2d55;
  --line:#d9dee6;
  --bg:#f4f6f8;
  --text:#15202b;
  --sub:#687482;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
}

header{
  background:var(--navy);
  color:#fff;
  padding:24px 20px;
}

.header-inner{
  max-width:760px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:14px;
}

header img{
  width:54px;
  height:54px;
  object-fit:contain;
}

header b{
  font-size:25px;
}

main{
  max-width:760px;
  margin:auto;
  padding:32px 16px 60px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:30px;
  margin-bottom:22px;
  box-shadow:0 2px 8px #00000008;
}

h1,h2{
  margin-top:0;
}

h1{
  font-size:32px;
}

h2{
  font-size:25px;
}

p{
  color:var(--sub);
  line-height:1.7;
}

input{
  width:100%;
  padding:17px;
  border:2px solid var(--line);
  border-radius:14px;
  font-size:18px;
  margin:10px 0;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:17px;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
  background:var(--navy);
  color:#fff;
  margin-top:10px;
}

button.secondary{
  background:#e9edf2;
  color:var(--text);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.message{
  margin-top:14px;
  font-weight:700;
  color:#c0392b;
}

.hidden{
  display:none !important;
}

.nav{
  display:flex;
  gap:8px;
  margin-bottom:22px;
}

.nav button{
  margin:0;
  padding:13px 8px;
  font-size:15px;
}

.status{
  text-align:center;
}

.ball{
  width:150px;
  height:150px;
  object-fit:contain;
  margin:10px auto 20px;
  display:block;
}

.name{
  font-size:28px;
  font-weight:900;
}

.score{
  font-size:42px;
  font-weight:900;
  color:var(--navy);
  margin:10px 0;
}

.result{
  font-size:36px;
  font-weight:900;
  margin:24px 0 8px;
}

.points{
  font-size:22px;
  font-weight:800;
  color:var(--navy);
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:14px 8px;
  border-bottom:1px solid var(--line);
  text-align:left;
}

th{
  color:var(--sub);
}

.rank{
  font-size:20px;
  font-weight:900;
}

.rank1{
  color:#d4af37;
}

.rank2{
  color:#aeb4bd;
}

.rank3{
  color:#b87333;
}

.note{
  font-size:13px;
}

@media(max-width:600px){
  header{
    padding:22px 18px;
  }

  header img{
    width:48px;
    height:48px;
  }

  header b{
    font-size:21px;
  }

  main{
    padding:22px 14px 50px;
  }

  .card{
    padding:24px 20px;
  }

  h1{
    font-size:28px;
  }

  .ball{
    width:130px;
    height:130px;
  }

  th,td{
    padding:13px 5px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <img src="baseball.png" alt="野球ボール">
    <b>虹学野球チャレンジ</b>
  </div>
</header>

<main>

<section id="gatePage">
  <div class="card">
    <h1>参加者限定</h1>
    <p>参加者用パスワードを入力してください。</p>

    <input
      id="passwordInput"
      type="password"
      placeholder="パスワード"
    >

    <button onclick="enterGate()">入場する</button>

    <div id="gateMessage" class="message"></div>
  </div>
</section>

<section id="registerPage" class="hidden">
  <div class="card">
    <h1>ユーザー登録</h1>

    <p>
      チャレンジで使用する名前を登録してください。
    </p>

    <input
      id="nameInput"
      maxlength="30"
      placeholder="名前"
    >

    <button onclick="registerUser()">登録する</button>

    <div id="registerMessage" class="message"></div>
  </div>
</section>

<section id="appPage" class="hidden">

  <div class="nav">
    <button onclick="showPlay()">チャレンジ</button>
    <button onclick="showRanking()">ランキング</button>
    <button onclick="showProfile()">登録情報</button>
  </div>

  <section id="playView">

    <div class="card status">

      <img
        src="baseball.png"
        class="ball"
        alt="野球ボール"
      >

      <div id="playerName" class="name"></div>

      <div id="playerScore" class="score">0pt</div>

      <p id="playStatus">
        本日のチャレンジ状況を確認しています。
      </p>

      <button
        id="playButton"
        onclick="playGame()"
      >
        今日のチャレンジ
      </button>

      <div id="resultArea" class="hidden">
        <div id="resultText" class="result"></div>
        <div id="pointsText" class="points"></div>
      </div>

      <div id="playMessage" class="message"></div>

    </div>

  </section>

  <section id="rankingView" class="hidden">

    <div class="card">

      <h2>ランキング</h2>

      <p>
        累計得点ランキング
      </p>

      <table>

        <thead>
          <tr>
            <th>順位</th>
            <th>名前</th>
            <th>得点</th>
          </tr>
        </thead>

        <tbody id="rankingBody"></tbody>

      </table>

    </div>

  </section>

  <section id="profileView" class="hidden">

    <div class="card">

      <h2>登録情報</h2>

      <p>
        現在の登録名
      </p>

      <div id="profileName" class="name"></div>

      <input
        id="newNameInput"
        maxlength="30"
        placeholder="新しい名前"
      >

      <button onclick="changeName()">
        名前を変更する
      </button>

      <div id="profileMessage" class="message"></div>

    </div>

  </section>

</section>

</main>

<script>
const API_URL =
  'https://nijigaku-baseball-free-api.s-h-k-p-h-990.workers.dev';

const TOKEN_KEY = 'nijigaku_baseball_token';

let token = localStorage.getItem(TOKEN_KEY) || '';
let gateToken = '';
let currentUser = null;

function esc(value){
  return String(value ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'",'&#039;');
}

async function api(path,options={}){
  const headers = {
    'Content-Type':'application/json',
    ...(options.headers || {})
  };

  const authToken =
    options.gateToken ||
    token;

  if(authToken){
    headers.Authorization =
      `Bearer ${authToken}`;
  }

  const response = await fetch(
    API_URL + path,
    {
      ...options,
      headers
    }
  );

  let data = {};

  try{
    data = await response.json();
  }catch{}

  if(!response.ok){
    throw new Error(
      data.error ||
      '通信に失敗しました'
    );
  }

  return data;
}

function hidePages(){
  document
    .getElementById('gatePage')
    .classList.add('hidden');

  document
    .getElementById('registerPage')
    .classList.add('hidden');

  document
    .getElementById('appPage')
    .classList.add('hidden');
}

async function enterGate(){

  const password =
    document
      .getElementById('passwordInput')
      .value;

  const message =
    document
      .getElementById('gateMessage');

  message.textContent = '';

  try{

    const data = await api(
      '/auth',
      {
        method:'POST',
        body:JSON.stringify({
          password
        })
      }
    );

    gateToken = data.token;

    hidePages();

    document
      .getElementById('registerPage')
      .classList.remove('hidden');

  }catch(error){

    message.textContent =
      error.message;

  }
}

async function registerUser(){

  const name =
    document
      .getElementById('nameInput')
      .value
      .trim();

  const message =
    document
      .getElementById('registerMessage');

  message.textContent = '';

  try{

    const data = await api(
      '/register',
      {
        method:'POST',
        gateToken,
        body:JSON.stringify({
          name
        })
      }
    );

    token = data.token;

    localStorage.setItem(
      TOKEN_KEY,
      token
    );

    gateToken = '';

    await loadMe();

  }catch(error){

    message.textContent =
      error.message;

  }
}

async function loadMe(){

  try{

    const data =
      await api('/me');

    currentUser =
      data.user;

    hidePages();

    document
      .getElementById('appPage')
      .classList.remove('hidden');

    renderUser();

    showPlay();

  }catch{

    token = '';

    localStorage.removeItem(
      TOKEN_KEY
    );

    hidePages();

    document
      .getElementById('gatePage')
      .classList.remove('hidden');

  }
}

function renderUser(){

  if(!currentUser) return;

  document
    .getElementById('playerName')
    .textContent =
      currentUser.name;

  document
    .getElementById('playerScore')
    .textContent =
      `${currentUser.score || 0}pt`;

  document
    .getElementById('profileName')
    .textContent =
      currentUser.name;

  const playButton =
    document
      .getElementById('playButton');

  const status =
    document
      .getElementById('playStatus');

  const resultArea =
    document
      .getElementById('resultArea');

  if(currentUser.todayResult){

    playButton.disabled = true;

    playButton.textContent =
      '本日は挑戦済み';

    status.textContent =
      '今日のチャレンジ結果';

    resultArea
      .classList
      .remove('hidden');

    document
      .getElementById('resultText')
      .textContent =
        currentUser.todayResult;

    document
      .getElementById('pointsText')
      .textContent =
        `+${currentUser.todayPoints || 0}pt`;

  }else{

    playButton.disabled = false;

    playButton.textContent =
      '今日のチャレンジ';

    status.textContent =
      '1日1回チャレンジできます。';

    resultArea
      .classList
      .add('hidden');

  }
}

async function playGame(){

  const button =
    document
      .getElementById('playButton');

  const message =
    document
      .getElementById('playMessage');

  message.textContent = '';

  button.disabled = true;

  button.textContent =
    'チャレンジ中...';

  try{

    const data =
      await api(
        '/play',
        {
          method:'POST'
        }
      );

    currentUser =
      data.user;

    renderUser();

  }catch(error){

    message.textContent =
      error.message;

    await loadMe();

  }
}

function hideViews(){

  document
    .getElementById('playView')
    .classList.add('hidden');

  document
    .getElementById('rankingView')
    .classList.add('hidden');

  document
    .getElementById('profileView')
    .classList.add('hidden');
}

function showPlay(){

  hideViews();

  document
    .getElementById('playView')
    .classList.remove('hidden');

}

async function showRanking(){

  hideViews();

  document
    .getElementById('rankingView')
    .classList.remove('hidden');

  const body =
    document
      .getElementById('rankingBody');

  body.innerHTML =
    '<tr><td colspan="3">読み込み中...</td></tr>';

  try{

    const data =
      await api('/ranking');

    body.innerHTML =
      data.ranking.length
      ?
      data.ranking.map(
        (user,index)=>{

          let rankClass = '';

          if(index === 0)
            rankClass = 'rank rank1';

          if(index === 1)
            rankClass = 'rank rank2';

          if(index === 2)
            rankClass = 'rank rank3';

          return `
            <tr>
              <td>
                <span class="${rankClass}">
                  ${index + 1}位
                </span>
              </td>

              <td>
                ${esc(user.name)}
              </td>

              <td>
                ${user.score || 0}pt
              </td>
            </tr>
          `;

        }
      ).join('')
      :
      '<tr><td colspan="3">まだ登録者はいません</td></tr>';

  }catch(error){

    body.innerHTML =
      `<tr><td colspan="3">${esc(error.message)}</td></tr>`;

  }
}

function showProfile(){

  hideViews();

  document
    .getElementById('profileView')
    .classList.remove('hidden');

}

async function changeName(){

  const newName =
    document
      .getElementById('newNameInput')
      .value
      .trim();

  const message =
    document
      .getElementById('profileMessage');

  message.textContent = '';

  try{

    const data =
      await api(
        '/name',
        {
          method:'POST',
          body:JSON.stringify({
            name:newName
          })
        }
      );

    currentUser =
      data.user;

    document
      .getElementById('newNameInput')
      .value = '';

    renderUser();

    message.style.color =
      '#237a3b';

    message.textContent =
      '名前を変更しました';

  }catch(error){

    message.style.color =
      '#c0392b';

    message.textContent =
      error.message;

  }
}

if(token){
  loadMe();
}
</script>

</body>
</html>
