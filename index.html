<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>虹学野球チャレンジ</title>
<style>:root{--n:#05284d;--l:#d9dee6;--b:#f4f6f8}*{box-sizing:border-box}body{margin:0;background:var(--b);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#15202b}header{background:var(--n);color:white;padding:14px 18px;display:flex;align-items:center;gap:10px}header img{width:34px;height:34px}main{max-width:760px;margin:auto;padding:16px 16px 90px}.card{background:white;border:1px solid var(--l);border-radius:14px;padding:18px;margin-bottom:16px}.hidden{display:none!important}.center{text-align:center}.muted{color:#65717d;font-size:13px}input{width:100%;padding:13px;border:1px solid var(--l);border-radius:10px;font-size:16px;margin:8px 0}button{border:0;border-radius:10px;padding:13px;font-weight:700}.primary{width:100%;background:var(--n);color:white}.secondary{width:100%;background:#e9eef4;color:var(--n)}.danger{width:100%;background:#c62828;color:white}.ball{width:130px;height:130px;object-fit:contain}.result{font-size:28px;font-weight:900}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f5f7fa;border-radius:10px;padding:14px}.stat b{display:block;font-size:22px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:white;border-top:1px solid var(--l)}nav button{flex:1;background:white;color:#65717d;border-radius:0}nav .active{color:var(--n)}table{width:100%;border-collapse:collapse}th,td{padding:11px 8px;border-bottom:1px solid var(--l);text-align:left}.admin{margin-top:30px;text-align:center;font-size:12px;color:#8b96a1;text-decoration:underline}.err{color:#c62828;font-size:13px}</style></head>
<body><header><img src="./baseball.png"><b>虹学野球チャレンジ</b></header><main>
<section id="gate" class="card"><h2>参加者限定</h2><p class="muted">参加者用パスワードを入力してください。</p><input id="pw" type="password" placeholder="パスワード"><button class="primary" id="enter">入場する</button><div id="ge" class="err"></div></section>
<section id="reg" class="card hidden"><h2>選手登録</h2><input id="rn" maxlength="30" placeholder="名前"><button class="primary" id="register">登録する</button><div id="re" class="err"></div></section>
<div id="app" class="hidden"><section id="play"><div class="card center"><h2>今日の挑戦</h2><p id="hello"></p><img class="ball" src="./baseball.png"><div id="state"></div><button class="primary" id="spin">回す！</button></div></section>
<section id="ranking" class="hidden"><div class="card"><h2>個人ランキング</h2><p id="updated" class="muted">読み込み中</p><table><thead><tr><th>順位</th><th>名前</th><th>得点</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section id="user" class="hidden"><div class="card"><h2>ユーザー情報</h2><div class="stats"><div class="stat">名前<b id="un">-</b></div><div class="stat">累計得点<b id="us">0pt</b></div><div class="stat">挑戦回数<b id="up">0回</b></div><div class="stat">ホームラン<b id="uh">0回</b></div></div><h3>名前を変更</h3><input id="nn" maxlength="30" placeholder="新しい名前"><button class="secondary" id="rename">名前を変更</button><div class="admin" id="ao">管理者</div></div>
<div id="ab" class="card hidden"><h2>管理者</h2><p class="muted">全ユーザー・得点・履歴を削除します。</p><input id="ap" type="password" placeholder="管理者パスワード"><input id="rw" placeholder="RESET と入力"><button class="danger" id="reset">全データリセット</button><div id="ae" class="err"></div></div></section></div></main>
<nav id="nav" class="hidden"><button data-p="play" class="active">⚾<br>挑戦</button><button data-p="ranking">🏆<br>ランキング</button><button data-p="user">👤<br>ユーザー</button></nav>
<script>
const API='__API_URL__',K='nijigaku-free-token';let token=localStorage.getItem(K)||'',me=null;
async function api(p,o={}){let h={...(o.headers||{})};if(token)h.Authorization='Bearer '+token;if(o.body&&typeof o.body!=='string'){h['Content-Type']='application/json';o.body=JSON.stringify(o.body)}let r=await fetch(API+p,{...o,headers:h,cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'通信に失敗しました');return d}
const $=id=>document.getElementById(id),show=id=>$(id).classList.remove('hidden'),hide=id=>$(id).classList.add('hidden');
async function start(){if(!token)return;try{me=(await api('/me')).user;hide('gate');show('app');show('nav');render()}catch{localStorage.removeItem(K);token=''}}
$('enter').onclick=async()=>{try{let d=await api('/auth',{method:'POST',body:{password:$('pw').value}});token=d.token;localStorage.setItem(K,token);hide('gate');show('reg')}catch(e){$('ge').textContent=e.message}};
$('register').onclick=async()=>{try{let d=await api('/register',{method:'POST',body:{name:$('rn').value}});token=d.token;localStorage.setItem(K,token);me=d.user;hide('reg');show('app');show('nav');render()}catch(e){$('re').textContent=e.message}};
function render(){$('hello').textContent=`こんにちは、${me.name}さん！`;$('un').textContent=me.name;$('us').textContent=me.score+'pt';$('up').textContent=me.plays+'回';$('uh').textContent=me.homeRuns+'回';if(me.todayResult){$('state').innerHTML=`<div class="result">${me.todayResult}</div><h3>＋${me.todayPoints}pt</h3><p class="muted">本日の挑戦は終了しました。次の挑戦は明日！</p>`;hide('spin')}else{$('state').innerHTML='<p class="muted">本日はまだ挑戦していません</p>';show('spin')}}
$('spin').onclick=async()=>{let b=$('spin');b.disabled=true;b.textContent='回転中…';try{await new Promise(r=>setTimeout(r,1000));me=(await api('/play',{method:'POST'})).user;render()}catch(e){alert(e.message)}finally{b.disabled=false;b.textContent='回す！'}};
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
async function ranks(){try{let d=await api('/ranking');$('rows').innerHTML=d.ranking.length?d.ranking.map((u,i)=>`<tr><td><b>${i+1}位</b></td><td>${esc(u.name)}</td><td>${u.score}pt</td></tr>`).join(''):'<tr><td colspan="3">まだ参加者はいません</td></tr>';$('updated').textContent='最終更新：'+new Date().toLocaleString('ja-JP')}catch(e){$('updated').textContent=e.message}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{['play','ranking','user'].forEach(hide);show(b.dataset.p);document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.p==='ranking')ranks()});
$('rename').onclick=async()=>{try{me=(await api('/name',{method:'POST',body:{name:$('nn').value}})).user;$('nn').value='';render()}catch(e){alert(e.message)}};
$('ao').onclick=()=>show('ab');$('reset').onclick=async()=>{if($('rw').value!=='RESET')return $('ae').textContent='RESET と入力してください';if(!confirm('本当に全データを削除しますか？'))return;try{await api('/admin/reset',{method:'POST',body:{adminPassword:$('ap').value,confirm:'RESET'}});localStorage.removeItem(K);alert('全データをリセットしました');location.reload()}catch(e){$('ae').textContent=e.message}};
start();
</script></body></html>
